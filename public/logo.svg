<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Asternal">
  <defs>
    <linearGradient id="ast-bg" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f66d6" />
      <stop offset="0.55" stop-color="#3f83e6" />
      <stop offset="1" stop-color="#54b6ea" />
    </linearGradient>
    <linearGradient id="ast-gloss" x1="0" y1="0" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ast-a" x1="32" y1="11" x2="32" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#f4faff" />
      <stop offset="1" stop-color="#c7e3ff" />
    </linearGradient>
    <linearGradient id="ast-rim" x1="33" y1="15" x2="46" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#7fd0ff" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="ast-glow" cx="32" cy="30" r="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ast-edge" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="ast-clip">
      <rect x="0" y="0" width="64" height="64" rx="17" />
    </clipPath>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="17" fill="url(#ast-bg)" />

  <g clip-path="url(#ast-clip)">
    <path d="M0 0 H30 L0 44 Z" fill="url(#ast-gloss)" />
    <circle cx="53" cy="55" r="20" fill="#0b1c3a" opacity="0.10" />
    <ellipse cx="32" cy="31" rx="20" ry="21" fill="url(#ast-glow)" />

    <!-- Sombra tallada de la letra -->
    <path d="M17.5 51.5 L32 12.5 L46.5 51.5 L38.6 51.5 L36.4 42.8 L27.6 42.8 L25.4 51.5 Z M28.7 38.5 L35.3 38.5 L32 25.8 Z"
      transform="translate(1.2 1.6)" fill="#0b1c3a" opacity="0.30" fill-rule="evenodd" />

    <!-- Letra «A» -->
    <path d="M17.5 51.5 L32 12.5 L46.5 51.5 L38.6 51.5 L36.4 42.8 L27.6 42.8 L25.4 51.5 Z M28.7 38.5 L35.3 38.5 L32 25.8 Z"
      fill="url(#ast-a)" fill-rule="evenodd" stroke="#f2f9ff" stroke-width="0.6" stroke-opacity="0.75" stroke-linejoin="round" />

    <!-- Canto iluminado del trazo derecho -->
    <path d="M32 16 L44.8 50.4" fill="none" stroke="url(#ast-rim)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Destello -->
    <circle cx="45.5" cy="15.5" r="7.5" fill="#ffffff" opacity="0.12" />
    <path d="M45.5 10.3 L46.9 14.1 L50.7 15.5 L46.9 16.9 L45.5 20.7 L44.1 16.9 L40.3 15.5 L44.1 14.1 Z"
      fill="#ffffff" opacity="0.95" />
  </g>

  <rect x="1" y="1" width="62" height="62" rx="16" fill="none" stroke="url(#ast-edge)" stroke-width="2" />
</svg>
