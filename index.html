<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <!-- La versión en la URL fuerza a los navegadores que ya tenían el icono
       antiguo en caché a pedir el nuevo. -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg?v=2" />
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor Asternal</title>
  <meta name="description" content="Editor nativo de escenas y juegos de Asternal." />
  <meta property="og:title" content="Editor Asternal" />
  <meta property="og:description" content="Editor nativo de escenas y juegos de Asternal." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- Tema guardado (claro / oscuro): se aplica antes del primer pintado para
       evitar el destello del tema equivocado. La interfaz es siempre
       Material 3. -->
  <script>
    (function () {
      try {
        var NativeWS = window.WebSocket;
        if (typeof NativeWS === "function") {
          var WrappedWS = function (url, protocols) {
            if (protocols === "vite-hmr" || (Array.isArray(protocols) && protocols.indexOf("vite-hmr") !== -1)) {
              var dummy = new EventTarget();
              dummy.readyState = 1;
              dummy.OPEN = 1;
              dummy.CONNECTING = 0;
              dummy.CLOSING = 2;
              dummy.CLOSED = 3;
              dummy.protocol = "vite-hmr";
              dummy.url = String(url || "");
              dummy.send = function () {};
              dummy.close = function () { dummy.readyState = 3; };
              return dummy;
            }
            return arguments.length > 1 ? new NativeWS(url, protocols) : new NativeWS(url);
          };
          WrappedWS.prototype = NativeWS.prototype;
          WrappedWS.CONNECTING = 0;
          WrappedWS.OPEN = 1;
          WrappedWS.CLOSING = 2;
          WrappedWS.CLOSED = 3;
          window.WebSocket = WrappedWS;
        }
      } catch (e) { /* ignore */ }
      try {
        var p = JSON.parse(localStorage.getItem("ast_preferences") || "{}");
        var theme = p.theme === "dark" ? "dark" : "light";
        var root = document.documentElement;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
      } catch (e) { /* sin preferencias: se usa el tema por defecto */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
